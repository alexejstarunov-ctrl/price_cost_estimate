name: Update prices

# Обновляет public/prices.json. Приложение работает и без этого фида —
# при недоступности источников остаются встроенные базовые расценки.

on:
  schedule:
    # Каждый понедельник в 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      enable_profi:
        description: 'Включить сбор с Профи.ру (их ToS это запрещает — только осознанно)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать цены
        env:
          ENABLE_PROFI: ${{ inputs.enable_profi && '1' || '0' }}
        run: node scripts/scrape.mjs

      - id: diff
        name: Проверить изменения
        run: |
          if git diff --quiet -- public/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Цены не изменились"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Закоммитить фид
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/prices.json
          git commit -m "chore: обновление рыночных цен"
          git push

  redeploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
